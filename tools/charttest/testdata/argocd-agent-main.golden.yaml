# Source: clearance-argocd-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearance-argocd-agent
  labels:
    app.kubernetes.io/name: clearance-argocd-agent
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
spec:
  # One agent: two would each post the same outcome and exception.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: clearance-argocd-agent
      app.kubernetes.io/instance: t
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clearance-argocd-agent
        app.kubernetes.io/instance: t
    spec:
      serviceAccountName: clearance-argocd-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: ghcr.io/jfillman/clearance-argocd-agent:v0.0.0-dev
          imagePullPolicy: IfNotPresent
          args:
            - --cluster=cluster-a
            - --environment=prod
            - --api-url=https://clearance-api.example.test
            - --core-url=https://clearance.example.test
            - --issuer=clearance
            - --argocd-namespace=argocd
            - --projects=tenants
            - --grant-api=clearance.hangar.io/v1
            - --grant-interval=30s
            - --scan-interval=1m
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - {name: clearance-token, mountPath: /var/run/secrets/tokens, readOnly: true}
      volumes:
        # The agent's whole credential: a short-lived token bound to the audience the core checks, rotated by the
        # kubelet and read fresh for each request. Nothing is stored.
        - name: clearance-token
          projected:
            sources:
              - serviceAccountToken: {path: clearance, audience: clearance, expirationSeconds: 3600}
