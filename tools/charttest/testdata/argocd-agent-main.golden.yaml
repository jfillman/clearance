apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clearance-argocd-agent
  labels:
    app.kubernetes.io/name: clearance-argocd-agent
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clearance-argocd-agent
      app.kubernetes.io/instance: t
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock: {cidr: 10.0.0.1/32}
      ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
    - to:
        - ipBlock: {cidr: 203.0.113.10/32}
      ports:
        - {port: 80, protocol: TCP}
        - {port: 443, protocol: TCP}
