name: chart
# charts/clearance: helm lint, render tests (tools/charttest) and kubeconform, then the install test on a fresh kind
# cluster with no Airframe, Glidepath or Autopilot: a plain Postgres, the chart from this checkout, the image built
# from this checkout, and a fake provider (tools/chart-install-test). release.yaml reruns the install test on the
# published chart and image.
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  HELM_VERSION: v3.21.3
  KUBECONFORM_VERSION: v0.8.0
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: helm lint charts/clearance --strict -f charts/clearance/ci/minimal-values.yaml
      - run: helm lint charts/clearance --strict -f charts/clearance/ci/full-values.yaml
      - name: render tests
        run: go test -v ./tools/charttest/
      - name: kubeconform (Kubernetes schemas, and the CRDs catalog for CNPG, ESO and Gateway API)
        run: |
          set -euo pipefail
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          for f in charts/clearance/ci/*-values.yaml; do
            echo "== $f"
            helm template clearance charts/clearance -n clearance -f "$f" |
              "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.35.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -ignore-missing-schemas
          done

  install:
    runs-on: ubuntu-latest
    needs: render
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: build the image and the installtest client
        run: |
          set -euo pipefail
          docker build --build-arg VERSION=ci -t clearance:ci .
          docker build --target installtest -t installtest:ci .
          docker image ls clearance:ci
      # The api Deployment runs `clearance api` (R-2b). Until that subcommand is in the binary, the install test
      # runs with api.enabled=false and says so; once it lands, the api is installed and checked automatically.
      - id: api
        name: does the image have `clearance api`?
        run: |
          if docker run --rm clearance:ci help 2>&1 | grep -qE '^  api( |$)'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the image has no 'clearance api' subcommand yet: the install test runs with api.enabled=false"
          fi
      - uses: helm/kind-action@v1.15.0
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: clearance
      - run: kind load docker-image clearance:ci installtest:ci --name clearance
      - name: install test
        env:
          CHART: charts/clearance
          IMAGE_REPO: clearance
          IMAGE_TAG: ci
          INSTALLTEST_IMAGE: installtest:ci
          API: ${{ steps.api.outputs.enabled }}
        run: tools/chart-install-test/run.sh
