name: go
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    # A scratch Postgres for the record store's tests (CLEARANCE_TEST_DSN; they skip without it).
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: clearance}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Autopilot's agent-definition schema, which internal/profile embeds byte for byte (CLEARANCE_AGENT_SCHEMA).
      - uses: actions/checkout@v4
        with:
          repository: jfillman/autopilot
          ref: main
          path: .autopilot
          sparse-checkout: src/autopilot/engine/schemas
      - uses: actions/setup-go@v5
        with:
          # Pinned to the newest 1.26 patch (govulncheck fails on standard-library vulnerabilities fixed in later
          # patches; "1.26.x" lags while setup-go's version list catches up). Bump when a new patch ships.
          go-version: "1.26.11"
      # helm and kustomize at the versions (and checksums) the clearance-cmp image pins in its Dockerfile, first on PATH:
      # the tests that run the real binaries (TestKustomize, TestRealKustomize..., TestRealHelm..., the chart tests)
      # then run against what Argo CD's plugin sidecar ships, and do not skip for want of a tool.
      - run: |
          tools/install-cmp-tools.sh "$RUNNER_TEMP/cmp-tools"
          echo "$RUNNER_TEMP/cmp-tools" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          helm version --template '{{.Version}}{{"\n"}}' | grep -x "$(sed -n 's/^ARG HELM_VERSION=//p' providers/argocd/cmp/Dockerfile)"
          kustomize version | grep -x "$(sed -n 's/^ARG KUSTOMIZE_VERSION=//p' providers/argocd/cmp/Dockerfile)"
      - run: go vet ./...
      - run: go build -o /dev/null ./providers/argocd/agent/cmd/argocd-agent
      - run: go build -o /dev/null ./providers/argocd/grantexpiry/cmd/grant-expiry
      - run: go build -o /dev/null ./providers/observe-aws/cmd/observe-aws
      - run: go build -o /dev/null ./providers/observe-k8s/cmd/observe-k8s
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
        env:
          CLEARANCE_TEST_DSN: postgres://postgres:test@localhost:5432/clearance?sslmode=disable
          CLEARANCE_AGENT_SCHEMA: ${{ github.workspace }}/.autopilot/src/autopilot/engine/schemas/agent-definition.schema.json
      # The real-binary tests ran, they did not skip: a tool missing from PATH would skip them silently above.
      - run: |
          set -euo pipefail
          go test -count=1 -v ./internal/argosrc ./providers/argocd/cmp ./tools/charttest 2>&1 | tee "$RUNNER_TEMP/real-binary.log"
          # ... and the render-step sandbox and limits (W-34): the token is out of a step's reach under Landlock, and the
          # kernel limits stop a step (these fail, not skip, in CI when the runner's kernel has no Landlock).
          for t in TestKustomize TestRealKustomizeDoesNotFetchAnHTTPBaseUnderTheSandbox TestRealHelmDoesNotReachAnHTTPDependencyUnderTheSandbox \
            TestRenderStepCannotReadTheToken TestRealKustomizeCannotReadTheToken TestRealHelmCannotReadTheTokenThroughASymlink \
            TestCPUBoundStopsAStep TestMemoryBoundStopsAStep TestAToolCannotRequestAnUnsandboxedRetry TestAStepsDescendantsDoNotOutliveIt \
            TestADetachedDescendantDoesNotOutliveItsStep TestTheLandlockProbeNeedsNoToolOnPath \
            TestWithoutReapingOtherProcessesAreLeftAlone TestReapingSerialisesSteps \
            TestADetachedDescendantWithAnEmptyEnvironmentIsStopped TestALongChainOfDetachedDescendantsIsStopped \
            TestACleanupThatRunsOutOfTimeFailsTheStep TestAZombieIsReapedEvenAtTheBound; do
            grep -E "^--- PASS: $t " "$RUNNER_TEMP/real-binary.log"
          done
          ! grep -E 'is not installed|is not on PATH' "$RUNNER_TEMP/real-binary.log"
        env:
          CLEARANCE_AGENT_SCHEMA: ${{ github.workspace }}/.autopilot/src/autopilot/engine/schemas/agent-definition.schema.json
      # Fuzz the parsers (section 12): every Fuzz* target in the module, 10s each (tools/fuzz-all.sh finds them), but
      # the plugin's path and parameter targets, which cmp.yaml's cmp-fuzz job runs for 30s each.
      - run: tools/fuzz-all.sh 10s
        env:
          FUZZ_EXCLUDE: '^github\.com/jfillman/clearance/(providers/argocd/cmp|internal/argosrc)$'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  # The plugin's image smoke test, upgrade test, fuzzing, soak and HA checks are .github/workflows/cmp.yaml, which the
  # release workflow also calls before it builds an image.

  # The agent image (providers/argocd/agent/Dockerfile) carries two binaries since I-44: the agent (the entrypoint) and the
  # grant-expiry webhook (/grant-expiry, the chart's grantExpiry Deployment). Built for the runner's architecture, never pushed.
  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f providers/argocd/agent/Dockerfile --build-arg VERSION=v0.0.0-ci -t clearance-argocd-agent:ci .
        env:
          DOCKER_BUILDKIT: "1"
      - run: |
          set -euo pipefail
          test "$(docker run --rm clearance-argocd-agent:ci --version)" = "argocd-agent/0.0.0-ci"
          test "$(docker run --rm --entrypoint /grant-expiry clearance-argocd-agent:ci --version)" = "grant-expiry/0.0.0-ci"
  # The Python client (clients/python): generated from the contract, tested against a real `clearance core --memory`.
  python-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The generated models and version are current (the Go test in tools/pyclient checks the same).
      - run: go run ./tools/pyclient -check
      - run: go build -o "$RUNNER_TEMP/clearance" ./cmd/clearance
      - run: pip install -e "clients/python[test]" build
      - run: pytest -q clients/python
        env:
          CLEARANCE_BIN: ${{ runner.temp }}/clearance
      # The wheel builds, carries the generated modules, and its version is the clearance release's.
      - run: |
          python -m build clients/python -o "$RUNNER_TEMP/dist"
          python -m zipfile -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'clearance_client/_models.py'
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' clients/python/src/clearance_client/_version.py)
          ls "$RUNNER_TEMP"/dist/clearance_core_client-"$v"-py3-none-any.whl
  # The register action (register/action.yml) builds the Go binary at its own ref and runs it: a dry run, which
  # validates the request the gate would get and stops before fetching an OIDC token or calling Clearance.
  register-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "$RUNNER_TEMP/after"
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata: {name: probe, namespace: shop}\ndata: {a: "1"}\n' > "$RUNNER_TEMP/after/cm.yaml"
      - id: register
        uses: ./register
        with:
          url: http://clearance.invalid
          app: probe
          env: prod
          cluster: ci
          after: ${{ runner.temp }}/after
          args: --check ci=pass --dry-run
      - run: test -n "${{ steps.register.outputs.result }}" && command -v clearance
  # G-ARGO-2: the ClearanceGrant CRD and the admission policies against a real kube-apiserver (envtest binaries); I-44: the
  # grant-expiry webhook against one too.
  admission-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
      - run: |
          set -euo pipefail
          assets="$($(go env GOPATH)/bin/setup-envtest use 1.36.2 -p path)"
          test -n "$assets"
          test -x "$assets/kube-apiserver"
          KUBEBUILDER_ASSETS="$assets" python3 providers/argocd/crd/test_admission.py
      # I-44: the grant-expiry webhook binary, called by the same kind of real kube-apiserver through the chart's own
      # ValidatingWebhookConfiguration (matchConditions, exclusions, the clock, failurePolicy Fail and Ignore, the audit annotation).
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.21.3
      - run: |
          set -euo pipefail
          assets="$("$(go env GOPATH)/bin/setup-envtest" use 1.36.2 -p path)"
          KUBEBUILDER_ASSETS="$assets" python3 providers/argocd/grantexpiry/test_webhook.py
  # The Terraform gate action (terraform/action.yml) is linted and run: its metadata parses, every composite step names
  # a shell, shellcheck passes on each embedded script, and a dry run of the hold step validates the request the
  # gate would get from a fixture plan, stopping before an OIDC token is fetched or Clearance is called.
  terraform-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint terraform/action.yml
        run: |
          python3 - <<'PY'
          import subprocess, sys, yaml
          a = yaml.safe_load(open("terraform/action.yml"))
          assert a["name"] and a["description"] and a["runs"]["using"] == "composite"
          for k in ("step", "url", "plan"):
              assert a["inputs"][k]["required"] is True, k
          bad = 0
          for i, st in enumerate(a["runs"]["steps"]):
              if "run" in st:
                  assert st.get("shell") == "bash", st
                  r = subprocess.run(["shellcheck", "-s", "bash", "-"], input=st["run"], text=True)
                  bad += r.returncode
          sys.exit(1 if bad else 0)
          PY
      - run: printf 'the saved plan' > "$RUNNER_TEMP/tfplan"
      - id: hold
        uses: ./terraform
        with:
          step: hold
          url: http://clearance.invalid
          plan: ${{ runner.temp }}/tfplan
          json: internal/tfplan/testdata/update.json
          app: probe
          env: lab
          backend: s3
          state-key: network/lab/terraform.tfstate
          args: --check ci=pass --dry-run
      - run: |
          test -n "${{ steps.hold.outputs.result }}" && command -v clearance
  # The pinned web UI bundle (web-ui.lock): the release resolves over https and its sha256 is the pin's, then a
  # release-style build embeds it (the same steps the Dockerfile runs before `go build`, so a bad pin fails here
  # and not at release). The download is cached by the pinned sha256, so a rerun costs nothing.
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/clearance-web-ui
          key: web-ui-${{ hashFiles('web-ui.lock') }}
      - run: go run ./tools/webui -verify
      - run: go run ./tools/webui
      - run: CLEARANCE_REQUIRE_UI_BUNDLE=1 go test -count=1 -run 'TestReleaseBundleIsTheUI|TestStaticFallbackAndEmbeddedBundle' -v ./internal/web
      - run: go build -trimpath -o "$RUNNER_TEMP/clearance" ./cmd/clearance
      # The binary serves the UI's entry page, not the placeholder.
      - run: |
          set -euo pipefail
          grep -q 'assets/index-' internal/web/static/index.html
          ! grep -q 'is not built into this binary' internal/web/static/index.html
