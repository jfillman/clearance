# The manifest-tree digest parity fixture: Glidepath's clearance-gate check computes the same tree for this render
# (render_test.go TestTreeDigestIsGlidepaths names the value and how it was produced).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: app-shop-prod
  labels: {app: shop, team: "café"}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - name: shop
          image: ghcr.io/acme/shop@sha256:1111111111111111111111111111111111111111111111111111111111111111
          env: [{name: GREETING, value: "héllo"}, {name: ENABLED, value: "yes"}]
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: app-shop-prod}
spec:
  ports: [{port: 80, targetPort: 8080}]
  selector: {app: shop}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: shop-reader}
rules: [{apiGroups: [""], resources: [pods], verbs: [get, list]}]
