{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clearance.apiName" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "clearance.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clearance.selector" (dict "ctx" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "clearance.apiSA" . }}
      # Its own token authorizes the TokenReview of its callers' tokens.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "clearance.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "clearance.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - name: CLEARANCE_API_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clearance.readerSecretName" . }}
                  key: {{ include "clearance.readerSecretKey" . }}
            - name: CLEARANCE_CORE_URL
              value: {{ printf "http://%s.%s.svc:%v" (include "clearance.coreName" .) .Release.Namespace .Values.service.port | quote }}
            {{- with .Values.api.gatewayURL }}
            - name: CLEARANCE_GATEWAY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.auditors }}
            - name: CLEARANCE_API_AUDITORS
              value: {{ include "clearance.csv" . | quote }}
            {{- end }}
            {{- with .Values.api.notifiers }}
            - name: CLEARANCE_API_NOTIFIERS
              value: {{ include "clearance.csv" . | quote }}
            {{- end }}
            - name: CLEARANCE_API_POOL
              value: {{ .Values.api.pool | quote }}
            - name: CLEARANCE_API_DEFINITIONS_INTERVAL
              value: {{ .Values.api.definitionsInterval | quote }}
            {{- include "clearance.sharedEnv" . | nindent 12 }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "clearance.probes" (dict "startupSeconds" 60) | nindent 10 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "clearance.securityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "clearance.sharedMounts" . | nindent 12 }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "clearance.sharedVolumes" . | nindent 8 }}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clearance.apiName" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "clearance.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "clearance.apiName" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "clearance.selector" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}
{{- end }}
