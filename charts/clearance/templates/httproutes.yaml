{{- range $component := list "core" "api" "web" }}
{{- $r := index $.Values.httpRoutes $component }}
{{- if and $r.enabled (or (eq $component "core") (and (eq $component "api") $.Values.api.enabled) (and (eq $component "web") $.Values.web.enabled)) }}
{{- if not $r.parentRefs }}{{ fail (printf "httpRoutes.%s.parentRefs is required when it is enabled" $component) }}{{ end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "clearance.fullname" $ }}-{{ $component }}
  labels:
    {{- include "clearance.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  parentRefs:
    {{- toYaml $r.parentRefs | nindent 4 }}
  {{- with $r.hostnames }}
  hostnames: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with $r.matches }}
      matches: {{ toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ printf "%s-%s" (include "clearance.fullname" $) $component }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
