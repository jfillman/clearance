{{- define "clearance.esRemote" -}}
key: {{ .key }}
{{- with .property }}
property: {{ . }}
{{- end }}
{{- end -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $store := required "externalSecrets.secretStoreRef.name is required with externalSecrets.enabled" $es.secretStoreRef.name }}
{{- if $es.githubApp.privateKey.key }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "clearance.fullname" . }}-github-app
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $es.secretStoreRef.kind }}}
  target:
    name: {{ include "clearance.fullname" . }}-github-app
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.githubApp.privateKeyKey }}
      remoteRef:
        {{- include "clearance.esRemote" $es.githubApp.privateKey | nindent 8 }}
    - secretKey: {{ .Values.githubApp.webhookSecretKey }}
      remoteRef:
        {{- $_ := required "externalSecrets.githubApp.webhookSecret.key is required with the private key" $es.githubApp.webhookSecret.key }}
        {{- include "clearance.esRemote" $es.githubApp.webhookSecret | nindent 8 }}
---
{{- end }}
{{- if $es.database.dsn.key }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "clearance.fullname" . }}-db
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $es.secretStoreRef.kind }}}
  target:
    name: {{ include "clearance.fullname" . }}-db
    creationPolicy: Owner
  data:
    - secretKey: uri
      remoteRef:
        {{- include "clearance.esRemote" $es.database.dsn | nindent 8 }}
---
{{- end }}
{{- if and $es.reader.password.key .Values.cnpg.enabled .Values.cnpg.reader.enabled }}
# The reader role's Secret: basic-auth for CNPG's managed role, and the api's DSN built from the same password.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "clearance.pgName" . }}-reader
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {name: {{ $store }}, kind: {{ $es.secretStoreRef.kind }}}
  target:
    name: {{ include "clearance.pgName" . }}-reader
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.cnpg.reader.name }}
        password: "{{ "{{" }} .password {{ "}}" }}"
        uri: "postgresql://{{ .Values.cnpg.reader.name }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ include "clearance.pgName" . }}-rw.{{ .Release.Namespace }}.svc:5432/{{ .Values.cnpg.database }}"
  data:
    - secretKey: password
      remoteRef:
        {{- include "clearance.esRemote" $es.reader.password | nindent 8 }}
{{- end }}
{{- end }}
