{{- if .Values.core.replicas }}{{ fail "core.replicas is not a setting: the core is always one replica (the one writer of the evidence chain)" }}{{ end -}}
{{- range .Values.gate.trustedRegistries }}{{ if not (hasSuffix "/" .) }}{{ fail (printf "gate.trustedRegistries: %q must end in \"/\"" .) }}{{ end }}{{ end -}}
{{- range .Values.gate.protectedEnvironments }}{{ if ne (len (splitList "/" .)) 2 }}{{ fail (printf "gate.protectedEnvironments: %q is not <cluster>/<env>" .) }}{{ end }}{{ end -}}
{{- if .Values.ledger.enabled }}{{ if not .Values.ledger.existingSecret }}{{ fail "ledger.enabled needs ledger.existingSecret (the log's signing key: make it with `clearance ledger keygen`)" }}{{ end }}{{ if not .Values.ledger.witnessPolicy }}{{ fail "ledger.enabled needs ledger.witnessPolicy (at least one witness: a log nobody countersigns is not a ledger)" }}{{ end }}{{ end -}}
{{- if not (has (toString .Values.githubApp.comments) (list "off" "agent-failures")) }}{{ fail "githubApp.comments is off or agent-failures" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clearance.coreName" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  # One writer: the core holds Postgres's advisory writer lock for its life, and a second core fails to start.
  # Recreate stops the old pod before the new one starts, so an upgrade never runs two.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "clearance.selector" (dict "ctx" . "component" "core") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clearance.selector" (dict "ctx" . "component" "core") | nindent 8 }}
        {{- with .Values.core.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.core.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "clearance.coreSA" . }}
      # The core's own token (the API server's audience) authorizes its TokenReview calls.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "clearance.podSecurityContext" . | nindent 8 }}
      containers:
        - name: core
          image: {{ include "clearance.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["core"]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - name: CLEARANCE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clearance.dbSecretName" . }}
                  key: {{ include "clearance.dbSecretKey" . }}
            {{- with .Values.providers }}
            - name: CLEARANCE_PROVIDERS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.verifiers }}
            - name: CLEARANCE_VERIFIERS
              value: {{ include "clearance.csv" . | quote }}
            {{- end }}
            - name: CLEARANCE_EXPIRE_SECONDS
              value: {{ .Values.gate.expireSeconds | quote }}
            {{- with .Values.core.maxClockSkew }}
            - name: CLEARANCE_MAX_CLOCK_SKEW
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gate.agentLogins }}
            - name: AGENT_LOGINS
              value: {{ include "clearance.csv" . | quote }}
            {{- end }}
            {{- with .Values.gate.modelRoutes }}
            - name: MODEL_ROUTES
              value: {{ include "clearance.csv" . | quote }}
            {{- end }}
            {{- if .Values.signing.existingSecret }}
            - name: CLEARANCE_SIGNING_KEY_FILE
              value: /etc/clearance/signing/{{ .Values.signing.key }}
            {{- end }}
            {{- with .Values.signing.kms }}
            - name: CLEARANCE_SIGNING_KMS
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.attestation.existingSecret .Values.attestation.keyless.fulcioUrl }}
            {{- fail "attestation: set existingSecret (a static key, labs) or keyless.fulcioUrl (Fulcio), not both" }}
            {{- end }}
            {{- if .Values.attestation.existingSecret }}
            - name: CLEARANCE_ATTEST_KEY_FILE
              value: /etc/clearance/attest/{{ .Values.attestation.key }}
            {{- end }}
            {{- if .Values.attestation.keyless.fulcioUrl }}
            - name: CLEARANCE_ATTEST_FULCIO_URL
              value: {{ .Values.attestation.keyless.fulcioUrl | quote }}
            - name: CLEARANCE_ATTEST_OIDC_TOKEN_FILE
              value: /var/run/clearance-attest/oidc-token
            {{- end }}
            {{- with .Values.attestation.rekorUrl }}
            - name: CLEARANCE_ATTEST_REKOR_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ledger.enabled }}
            - name: CLEARANCE_LEDGER_DIR
              value: /var/lib/clearance/ledger
            - name: CLEARANCE_LEDGER_KEY_FILE
              value: /etc/clearance/ledger/{{ .Values.ledger.key }}
            - name: CLEARANCE_LEDGER_WITNESS_POLICY_FILE
              value: /etc/clearance/ledger-config/witness-policy
            {{- if .Values.ledger.retiredKeys }}
            - name: CLEARANCE_LEDGER_RETIRED_KEYS_FILE
              value: /etc/clearance/ledger-config/retired-keys
            {{- end }}
            {{- with .Values.ledger.checkpointInterval }}
            - name: CLEARANCE_LEDGER_CHECKPOINT_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            - name: CLEARANCE_LEDGER_TIER3_WAIT
              value: {{ .Values.ledger.tier3Wait | quote }}
            {{- with .Values.ledger.stallAfter }}
            - name: CLEARANCE_LEDGER_STALL_AFTER
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.token.ttl }}
            - name: CLEARANCE_TOKEN_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.token.issuer }}
            - name: CLEARANCE_TOKEN_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.githubApp.enabled }}
            - name: CLEARANCE_GITHUB_APP_ID
              value: {{ required "githubApp.appId is required with githubApp.enabled" .Values.githubApp.appId | quote }}
            - name: CLEARANCE_GITHUB_APP_KEY_FILE
              value: /etc/clearance/github-app/{{ .Values.githubApp.privateKeyKey }}
            - name: CLEARANCE_GITHUB_APP_WEBHOOK_SECRET_FILE
              value: /etc/clearance/github-app/{{ .Values.githubApp.webhookSecretKey }}
            - name: CLEARANCE_GITHUB_APP_COMMENTS
              value: {{ .Values.githubApp.comments | quote }}
            {{- with .Values.githubApp.api }}
            - name: CLEARANCE_GITHUB_API
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.hcpRunTask.enabled }}
            - name: CLEARANCE_HCP_RUN_TASK_CONFIG_FILE
              value: /etc/clearance/hcp-run-task-config/config.json
            {{- end }}
            {{- include "clearance.sharedEnv" . | nindent 12 }}
            {{- with .Values.core.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "clearance.probes" (dict "startupSeconds" (int .Values.core.startupSeconds)) | nindent 10 }}
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          securityContext:
            {{- include "clearance.securityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "clearance.sharedMounts" . | nindent 12 }}
            {{- if .Values.githubApp.enabled }}
            - name: github-app
              mountPath: /etc/clearance/github-app
              readOnly: true
            {{- end }}
            {{- if .Values.hcpRunTask.enabled }}
            - name: hcp-run-task
              mountPath: /etc/clearance/hcp-run-task
              readOnly: true
            - name: hcp-run-task-config
              mountPath: /etc/clearance/hcp-run-task-config
              readOnly: true
            {{- end }}
            {{- if .Values.signing.existingSecret }}
            - name: signing-key
              mountPath: /etc/clearance/signing
              readOnly: true
            {{- end }}
            {{- if .Values.attestation.existingSecret }}
            - name: attest-key
              mountPath: /etc/clearance/attest
              readOnly: true
            {{- end }}
            {{- if .Values.attestation.keyless.fulcioUrl }}
            - name: attest-oidc-token
              mountPath: /var/run/clearance-attest
              readOnly: true
            {{- end }}
            {{- if .Values.ledger.enabled }}
            - name: ledger-key
              mountPath: /etc/clearance/ledger
              readOnly: true
            - name: ledger-config
              mountPath: /etc/clearance/ledger-config
              readOnly: true
            - name: ledger
              mountPath: /var/lib/clearance/ledger
            {{- end }}
            {{- with .Values.core.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "clearance.sharedVolumes" . | nindent 8 }}
        {{- if .Values.githubApp.enabled }}
        - name: github-app
          secret:
            secretName: {{ include "clearance.githubAppSecret" . }}
            defaultMode: 0400
            items:
              - {key: {{ .Values.githubApp.privateKeyKey | quote }}, path: {{ .Values.githubApp.privateKeyKey | quote }}}
              - {key: {{ .Values.githubApp.webhookSecretKey | quote }}, path: {{ .Values.githubApp.webhookSecretKey | quote }}}
        {{- end }}
        {{- if .Values.hcpRunTask.enabled }}
        - name: hcp-run-task
          secret:
            secretName: {{ required "hcpRunTask.existingSecret is required with hcpRunTask.enabled" .Values.hcpRunTask.existingSecret }}
            defaultMode: 0400
            items:
              {{- range .Values.hcpRunTask.installations }}
              - {key: {{ required "hcpRunTask.installations[].secretKey is required" .secretKey | quote }}, path: {{ .secretKey | quote }}}
              {{- end }}
        - name: hcp-run-task-config
          configMap:
            name: {{ include "clearance.fullname" . }}-hcp-run-task
        {{- end }}
        {{- if .Values.signing.existingSecret }}
        - name: signing-key
          secret:
            secretName: {{ .Values.signing.existingSecret }}
            defaultMode: 0400
            items:
              - {key: {{ .Values.signing.key | quote }}, path: {{ .Values.signing.key | quote }}}
        {{- end }}
        {{- if .Values.attestation.existingSecret }}
        - name: attest-key
          secret:
            secretName: {{ .Values.attestation.existingSecret }}
            defaultMode: 0400
            items:
              - {key: {{ .Values.attestation.key | quote }}, path: {{ .Values.attestation.key | quote }}}
        {{- end }}
        {{- if .Values.attestation.keyless.fulcioUrl }}
        - name: attest-oidc-token
          projected:
            sources:
              - serviceAccountToken:
                  path: oidc-token
                  audience: {{ .Values.attestation.keyless.audience | quote }}
                  expirationSeconds: {{ .Values.attestation.keyless.tokenExpirationSeconds }}
        {{- end }}
        {{- if .Values.ledger.enabled }}
        - name: ledger-key
          secret:
            secretName: {{ .Values.ledger.existingSecret }}
            defaultMode: 0400
            items:
              - {key: {{ .Values.ledger.key | quote }}, path: {{ .Values.ledger.key | quote }}}
        - name: ledger-config
          configMap:
            name: {{ include "clearance.coreName" . }}-ledger
        - name: ledger
          persistentVolumeClaim:
            claimName: {{ include "clearance.coreName" . }}-ledger
        {{- end }}
        {{- with .Values.core.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.core.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clearance.coreName" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "clearance.selector" (dict "ctx" . "component" "core") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
