{{- if .Values.core.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clearance.coreSA" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
  {{- with .Values.core.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if and .Values.api.enabled .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clearance.apiSA" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if and .Values.web.enabled .Values.web.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clearance.webSA" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if and .Values.slack.enabled .Values.slack.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clearance.slackSA" . }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack
  {{- with .Values.slack.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
# Only the projected token below is mounted; the API server is never called (callers are TokenReviewed by the core).
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.rbac.authDelegator }}
# The core and the api authenticate in-cluster callers by TokenReview (internal/authn WorkloadAuthenticator), which
# needs create on tokenreviews: the built-in system:auth-delegator ClusterRole. Nothing else is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-auth-delegator" .Release.Namespace (include "clearance.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "clearance.coreSA" . }}
    namespace: {{ .Release.Namespace }}
  {{- if .Values.api.enabled }}
  - kind: ServiceAccount
    name: {{ include "clearance.apiSA" . }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
