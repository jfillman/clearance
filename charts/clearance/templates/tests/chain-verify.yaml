{{- if .Values.tests.chainVerify }}
# helm test: the evidence chain verifies from genesis, read-only (the api's DSN).
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "clearance.fullname" . }}-chain-verify
  labels:
    {{- include "clearance.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{ toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- include "clearance.podSecurityContext" . | nindent 4 }}
  containers:
    - name: chain-verify
      image: {{ include "clearance.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["chain", "verify"]
      env:
        - name: CLEARANCE_DSN
          valueFrom:
            secretKeyRef:
              name: {{ include "clearance.readerSecretName" . }}
              key: {{ include "clearance.readerSecretKey" . }}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
      securityContext:
        {{- include "clearance.securityContext" . | nindent 8 }}
{{- end }}
