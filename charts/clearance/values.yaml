# Clearance chart values. docs/install.md explains each group; docs/core.md is the source of truth for the
# environment variables these become. No secret value belongs in this file: secrets are referenced by the name of
# an existing Secret (or created by an ExternalSecret) and mounted as files where the core reads a *_FILE.

image:
  repository: ghcr.io/jfillman/clearance
  # Default: "v" + the chart's appVersion (the release that packaged this chart).
  tag: ""
  # sha256:... of the image index. When set it is used instead of the tag (pin by digest in production).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# -- Who may call the core ----------------------------------------------------------------------------------------

# CLEARANCE_PROVIDERS: the registered providers. Without one, nobody may evaluate or record. Each entry is
# {name, version, principals: [<namespace>/<serviceaccount> globs], kinds?: [...], intent_capture?: redacted|full,
# definitions?: true (at most one provider: it publishes its cluster-pinned agent definitions, PUT /v1/definitions)}.
providers: []
#  - name: example-gateway
#    version: "1.0.0"
#    principals: ["gateway-system/gateway"]
#    definitions: true
# CLEARANCE_VERIFIERS: principal globs that may register changes and ask for provenance (gate providers, CI).
verifiers: []
# CLEARANCE_DELEGATES: principal globs that may act for a person they name (vocabulary.onBehalfOfHeader), e.g. a portal.
delegates: []
# CLEARANCE_ADMINS: principal globs (user:<login>) that may deny any held change.
admins: []
# -- Policy bundles (docs/core.md, Policy bundles) ---------------------------------------------------------------
policy:
  # CLEARANCE_BUNDLES: clearance.policy/v1 files, each from a ConfigMap you manage (the deployment ships its own,
  # Clearance ships none), mounted for the core and the api at /etc/clearance/bundles/<name>/<key>. Empty: the
  # core rules only.
  bundles: []
  #  - name: platform
  #    configMap: clearance-bundle-platform
  #    key: bundle.json
  # CLEARANCE_BUNDLE_SOURCES: where each source a bundle names is read at start, by name. A url is fetched over
  # HTTP(S) (sendToken: with a projected service-account token, of tokenAudience when set, else the API server's
  # default audience); a configMap is a file (key, default contract.json). A source that does not answer within
  # sourceWait leaves its bundle degraded (its tools denied R000, /readyz names it, still 200) until it answers; a
  # version the bundle is not written for stops the start.
  sources: {}
  #  contract:
  #    url: http://contract-api.example-system.svc:8080/v1/contract
  #    sendToken: true
  #    tokenAudience: ""
  # CLEARANCE_BUNDLE_SOURCE_WAIT (Go duration; empty: 10s).
  sourceWait: ""
  # NetworkPolicy egress rules (networkPolicy.enabled) for the core and the api to reach the sources.
  egress: []
  # CLEARANCE_ENV_*: how arguments name an environment tier (a lower-target tool pointed upper is R012). Empty:
  # the core's defaults (lower names dev, development, sandbox, scratch; no prefixes or suffixes).
  environments:
    lowerNames: []
    lowerPrefixes: []
    lowerProjectSuffixes: []
    upperRepoPrefixes: []

# The deployment's vocabulary (internal/vocab): names that are the platform's, not Clearance's. Empty: the core's
# defaults.
vocabulary:
  # CLEARANCE_ON_BEHALF_OF_HEADER (default X-Clearance-On-Behalf-Of)
  onBehalfOfHeader: ""
  # CLEARANCE_TRAILER_PREFIX: the prefix of an agent commit's trailers (default Clearance-)
  trailerPrefix: ""
  # CLEARANCE_RUN_IDENTITY_NAMESPACE: a workload agent's service-account namespace (default agent-runs)
  runIdentityNamespace: ""
  # CLEARANCE_BASELINE_DENY_PATHS (default CODEOWNERS, **/CODEOWNERS, .github/**) and _FIELDS (default none)
  baselineDenyPaths: []
  baselineDenyFields: []
  # CLEARANCE_GATE_OUTSIDE_GROUPS (default none) and CLEARANCE_GATE_OWNER_FALLBACK (default none)
  gateOutsideGroups: []
  gateOwnerFallback: ""
  # CLEARANCE_V0_PROVIDER: name/version for rows written before providers were recorded (default unrecorded/unrecorded)
  v0Provider: ""
# CLEARANCE_AUDIENCE: the audience callers' projected service-account tokens carry (TokenReview), and the audience
# of a foreign cluster's tokens.
audience: clearance

# -- The deployment gate and definitions --------------------------------------------------------------------------
gate:
  # CLEARANCE_EXPIRE_SECONDS: how often holding changes past their TTL are expired.
  expireSeconds: 60
  # AGENT_LOGINS: GitHub logins agents open PRs as (empty: none; an agent PR is known by its record or trailers).
  agentLogins: []
  # MODEL_ROUTES: alias=upstream pairs a definition release may name (empty: model aliases are not checked).
  modelRoutes: []
  # RUNTIME_IMAGES_EXTRA: globs a definition's runtime.image may match.
  runtimeImagesExtra: []
  # CLEARANCE_TRUSTED_REGISTRIES: image prefixes, each ending in "/", a tier-1 image bump may come from; a bump from
  # anywhere else is tier 2 (image:not-trusted-registry). Empty: any registry (the product default).
  trustedRegistries: []

# Bundled agent definitions (*.yaml) from a ConfigMap you manage, mounted at /etc/clearance/agents and named in
# CLEARANCE_AGENTS_DIR for the core and the api. Empty: none.
agents:
  configMap: ""

# -- People and other identities ---------------------------------------------------------------------------------
oidc:
  # CLEARANCE_OIDC_ISSUER and CLEARANCE_OIDC_AUDIENCE: people's OIDC issuer and their ID tokens' audience, together.
  issuer: ""
  audience: ""
  # CLEARANCE_OIDC_JWKS_URL (default <issuer>/keys) and CLEARANCE_OIDC_USER_CLAIM (default email).
  jwksURL: ""
  userClaim: ""
  # CLEARANCE_OIDC_ALLOWED_USERS: globs on the claim. Required with an issuer.
  allowedUsers: []

# Another cluster's workloads (CLEARANCE_FOREIGN_*), e.g. a portal's: its service-account issuer, its name, the <namespace>/<sa> globs it may use.
foreignCluster:
  issuer: ""
  cluster: ""
  serviceAccounts: []
  jwksURL: ""

# GitHub Actions callers (clearance register in a customer's CI): off while audience is empty.
githubActions:
  # CLEARANCE_GITHUB_OIDC_AUDIENCE
  audience: ""
  # CLEARANCE_GITHUB_OIDC_ALLOWED: globs on the token's sub (empty: the core's default, repo:*).
  allowed: []

# The Clearance GitHub App (CLEARANCE_GITHUB_APP_*). The private key and webhook secret come from a Secret, mounted
# as files; set existingSecret, or externalSecrets.githubApp to have one created.
githubApp:
  enabled: false
  appId: ""
  existingSecret: ""
  privateKeyKey: private-key.pem
  webhookSecretKey: webhook-secret
  # CLEARANCE_GITHUB_APP_COMMENTS: off | agent-failures
  comments: "off"
  # CLEARANCE_GITHUB_API (empty: https://api.github.com)
  api: ""

# A Backstage catalog: the gate's group directory and app owners. Empty url: nobody is in any group, so no person
# can clear a tier-2/3 change. The core and the api send a projected service-account token for tokenAudience,
# mounted at /var/run/clearance/backstage-token (BACKSTAGE_TOKEN_FILE).
backstage:
  url: ""
  tokenAudience: backstage
  tokenExpirationSeconds: 3600

# -- Postgres ------------------------------------------------------------------------------------------------------
# The core is the only writer of the database (an advisory writer lock); the api reads with a read-only role.
database:
  # A Secret holding the core's DSN (CLEARANCE_DSN). Default with cnpg.enabled: <fullname>-pg-app, key uri.
  existingSecret: ""
  key: uri
  reader:
    # A Secret holding the api's read-only DSN (CLEARANCE_API_DSN). Default with cnpg.reader.enabled:
    # <fullname>-pg-reader, key uri. Otherwise the core's Secret (opened read-only; prefer a reader role).
    existingSecret: ""
    key: uri

# An optional CloudNativePG Cluster (needs the CNPG operator). CNPG writes the owner's DSN to <fullname>-pg-app.
cnpg:
  enabled: false
  instances: 1
  imageName: ""
  database: clearance
  owner: clearance
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  # The read-only role for the api: clearance_reader, SELECT on the clearance_* tables (default privileges of the
  # owner). Its Secret (basic-auth: username, password, and uri for the api) is passwordSecret, or the one
  # externalSecrets.reader creates.
  reader:
    enabled: true
    name: clearance_reader
    passwordSecret: ""
  # The CNPG operator's namespace, allowed to reach the instances when networkPolicy.enabled.
  operatorNamespace: cnpg-system

# -- External Secrets Operator (optional) ------------------------------------------------------------------------
externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  refreshInterval: 1h
  # Each is {key, property?} in the store. Empty key: no ExternalSecret for it.
  # -> Secret <fullname>-github-app (githubApp.privateKeyKey, githubApp.webhookSecretKey)
  githubApp:
    privateKey: {key: "", property: ""}
    webhookSecret: {key: "", property: ""}
  # -> Secret <fullname>-db, key uri: the core's DSN for a Postgres outside this chart
  database:
    dsn: {key: "", property: ""}
  # -> Secret <fullname>-pg-reader (basic-auth + uri): the CNPG reader role's password
  reader:
    password: {key: "", property: ""}

# -- Workloads -----------------------------------------------------------------------------------------------------
# The core: always one replica, Recreate. Two cores would fork the evidence chain; the second fails to take the
# writer lock and does not start.
core:
  # CLEARANCE_MAX_CLOCK_SKEW: how far an evaluation's context.now may be from the core's clock, a Go duration ("": the
  # core's default, 5m; at most 24h). The core refuses 0 (off) here: off is for `clearance core --memory` test cores.
  maxClockSkew: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  # How long the core may take to start: it verifies the whole chain from genesis before it listens.
  startupSeconds: 300
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  # Pod hostAliases (e.g. a portal's hostname with no DNS, as in a lab).
  hostAliases: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# clearance-api: the read API (`clearance api`), stateless, two replicas behind a PodDisruptionBudget.
api:
  enabled: true
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  # CLEARANCE_API_AUDITORS and CLEARANCE_API_NOTIFIERS: principal globs.
  auditors: []
  notifiers: []
  # CLEARANCE_GATEWAY_URL: the AI gateway (where the runtime's writes go), named in /v1/contract. Empty: none.
  gatewayURL: ""
  # CLEARANCE_API_POOL: the read pool's size.
  pool: 5
  # CLEARANCE_API_DEFINITIONS_INTERVAL: seconds between re-reads of the stored agent definitions.
  definitionsInterval: 30
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  # Pod hostAliases (e.g. a portal's hostname with no DNS, as in a lab).
  hostAliases: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

service:
  type: ClusterIP
  port: 8080

# The core and the api authenticate in-cluster callers by TokenReview, which needs the system:auth-delegator
# ClusterRole. Turn off only if you bind it yourself.
rbac:
  authDelegator: true

# -- NetworkPolicy -----------------------------------------------------------------------------------------------
# Default-deny ingress and egress for every pod of the release, then only what each needs.
networkPolicy:
  enabled: true
  core:
    # NetworkPolicyPeers allowed to call the core on its port: providers, verifiers, the Gateway's namespace for
    # the GitHub App webhook. Empty: no pod may (the core is unreachable).
    from: []
  api:
    # NetworkPolicyPeers allowed to call clearance-api (a portal, auditors, the Gateway's namespace).
    from: []
  dns:
    namespace: kube-system
    podSelector: {k8s-app: kube-dns}
  # The Kubernetes API server, for TokenReview. It is not a pod, so it is an ipBlock: narrow cidrs to your API
  # server's endpoint addresses (kubectl get endpoints kubernetes) where you can.
  kubeAPIServer:
    cidrs: ["0.0.0.0/0"]
    ports: [443, 6443]
  # Postgres: NetworkPolicyPeers and the port. With cnpg.enabled the chart's own instances are added.
  postgres:
    to: []
    port: 5432
  # Further egress rules (NetworkPolicyEgressRule) for the core and the api: the OIDC JWKS, Backstage, the GitHub
  # API, a foreign cluster's JWKS.
  extraEgress: []

# -- Gateway API routes (optional) -------------------------------------------------------------------------------
httpRoutes:
  core:
    enabled: false
    parentRefs: []
    hostnames: []
    # HTTPRouteMatches; default every path. To expose only the GitHub App webhook publicly:
    # [{path: {type: Exact, value: /v1/github/webhook}}]
    matches: []
  api:
    enabled: false
    parentRefs: []
    hostnames: []
    matches: []

# `helm test`: a pod that runs `clearance chain verify` against the database (read-only).
tests:
  chainVerify: true
