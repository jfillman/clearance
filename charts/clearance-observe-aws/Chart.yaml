apiVersion: v2
name: clearance-observe-aws
description: >-
  Clearance's AWS collector (O-4): drains the EventBridge queue of an account's CloudTrail and AWS Config changes, reads the
  organization trail with log-file integrity validation, reconciles Config items with the events that caused them, runs the
  Terraform exception detectors, and reports each account's health. Read-only in AWS; no stored credential.
type: application
# The release workflow packages the chart at the tag's version; these are the development placeholders.
version: 0.0.0-dev
appVersion: 0.0.0-dev
kubeVersion: ">=1.30.0-0"
home: https://github.com/jfillman/clearance
sources:
  - https://github.com/jfillman/clearance
keywords: [clearance, aws, cloudtrail, observation]
