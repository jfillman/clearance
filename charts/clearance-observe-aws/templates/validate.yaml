{{- if not .Values.account }}{{ fail "account is required (the observed AWS account)" }}{{ end }}
{{- if not .Values.apiURL }}{{ fail "apiURL is required (clearance-api)" }}{{ end }}
{{- if not .Values.coreURL }}{{ fail "coreURL is required (the core)" }}{{ end }}
{{- if not .Values.queueURL }}{{ fail "queueURL is required (the EventBridge queue)" }}{{ end }}
{{- if not .Values.aws.roleARN }}{{ fail "aws.roleARN is required (the read-only role in the observed account)" }}{{ end }}
{{- if and .Values.trail.bucket (not .Values.aws.trailRoleARN) }}{{ fail "aws.trailRoleARN is required when trail.bucket is set (the logging account's read role)" }}{{ end }}
{{- if and .Values.trail.bucket (not .Values.trail.prefix) }}{{ fail "trail.prefix is required when trail.bucket is set" }}{{ end }}
