# The AWS collector's observation rule set (clearance.observe-rules/v1), generated by the chart from its values. The
# attribution orders and the classification are the pipeline's defaults (internal/observe/pipeline/default.yaml, the
# documentation in docs/observe-pipeline.md); what a deployment sets is its apply roles, SSO admin roles and governed accounts.
schema: clearance.observe-rules/v1
name: {{ .Values.ruleset.name }}
version: {{ .Values.ruleset.version | quote }}
cost_limit: 10000

identities:
  argo_controller: ["system:serviceaccount:argocd:argocd-application-controller"]
  # Application controllers of Argo CD instances that sync the cluster repository itself (not the gated instance above, whose
  # writes grants clear). Exact service-account subjects. Empty: no write is attributed to platform GitOps.
  platform_gitops: []
  federated_prefix: ["oidc:", "federated:"]
  task_id_extra_key: task_id
  apply_roles: {{ toJson .Values.ruleset.applyRoles }}
  sso_admin_roles: {{ toJson .Values.ruleset.ssoAdminRoles }}

annotations:
  grant: clearance.example.com/grant
  rendered: clearance.example.com/rendered
  strip: [clearance.example.com/tree, clearance.example.com/release, argocd.argoproj.io/tracking-id]
  # Argo CD's resource-tracking annotation (the "annotation" and "annotation+label" methods); platform-gitops reads it.
  tracking_id: argocd.argoproj.io/tracking-id
  # What a controller keeps on an object it manages is not a rendered field: hashing ignores it. An entry ending in "/" is a prefix.
  controller_owned: [rollout.argoproj.io/, rollouts.argoproj.io/, deployment.kubernetes.io/, notified.notifications.argoproj.io]
  controller_labels: [rollouts-pod-template-hash, pod-template-hash]

scope:
  governed:
    - provider: aws
      # Account ids are strings: a bare numeric value (helm --set) would otherwise render as a number.
      scopes: [{{ range $i, $a := (default (list .Values.account) .Values.ruleset.governedAccounts) }}{{ if $i }}, {{ end }}{{ toString $a | quote }}{{ end }}]

# No noise rules for AWS yet.
noise: []

# What protects monitoring, beside the deployment's CLEARANCE_MONITORING_PROTECTION_OPS: tier 3 whether or not the
# operation succeeded, alerts at once, flips the scope's health.
monitoring:
  aws: [StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors, StopConfigurationRecorder, DeleteConfigurationRecorder, DisableRule, DeleteRule]
  azure:
    - Microsoft.Insights/diagnosticSettings/delete
    - Microsoft.Insights/diagnosticSettings/write
    - Microsoft.Insights/logprofiles/delete
    - Microsoft.OperationalInsights/workspaces/delete
  google:
    - google.logging.v2.ConfigServiceV2.DeleteSink
    - google.logging.v2.ConfigServiceV2.UpdateSink
    - google.logging.v2.ConfigServiceV2.DeleteExclusion
  kubernetes: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
  kubernetes_configmaps: [kube-system/audit-policy]
  # The only carve-out: a controller that maintains its own webhook configurations. A succeeded write by exactly this
  # subject, with these verbs, to these kinds and names, is routine noise (counted as filtered under
  # monitoring-exempt:<name>): not monitoring-protection, no alert, no health flip, no exception. Anything else by the same
  # subject (another verb, another name, a refused attempt, the audit-policy ConfigMap) stays monitoring-protection.
  # A compromised named controller could change its own webhook without an alert: that is the price of the exemption.
  kubernetes_exempt:
    - name: kyverno-own-webhooks
      why: Kyverno's admission controller rewrites its own kyverno-* webhook configurations every ~20s.
      subject: "system:serviceaccount:kyverno:kyverno-admission-controller"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["kyverno-*"]
    - name: cert-manager-cainjector-cabundle
      why: cert-manager's cainjector patches caBundle into the webhook configurations that ask for it.
      subject: "system:serviceaccount:cert-manager:cert-manager-cainjector"
      verbs: [patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*"]
    - name: kyverno-cleanup-own-webhooks
      why: Kyverno's cleanup controller rewrites its own cleanup and TTL webhook configurations when it starts or the API server restarts.
      subject: "system:serviceaccount:kyverno:kyverno-cleanup-controller"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["kyverno-cleanup-*", "kyverno-ttl-*"]
    - name: tekton-operator-own-webhooks
      why: The Tekton operator reconciles its own webhook configurations when it starts or the API server restarts.
      subject: "system:serviceaccount:tekton-operator:tekton-operator"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*.operator.tekton.dev"]
    - name: tekton-operators-proxy-own-webhook
      why: Tekton's operator proxy webhook reconciles its own mutating webhook configuration.
      subject: "system:serviceaccount:tekton-pipelines:tekton-operators-proxy-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["proxy.operator.tekton.dev"]
    - name: tekton-pipelines-own-webhooks
      why: The Tekton Pipelines webhook reconciles its own webhook configurations.
      subject: "system:serviceaccount:tekton-pipelines:tekton-pipelines-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*.pipeline.tekton.dev"]
    - name: tekton-triggers-own-webhooks
      why: The Tekton Triggers webhook reconciles its own webhook configurations.
      subject: "system:serviceaccount:tekton-pipelines:tekton-triggers-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*.triggers.tekton.dev"]
    - name: pipelines-as-code-own-webhook
      why: The Pipelines-as-Code webhook reconciles its own validating webhook configuration.
      subject: "system:serviceaccount:tekton-pipelines:pipelines-as-code-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["validation.pipelinesascode.tekton.dev"]

