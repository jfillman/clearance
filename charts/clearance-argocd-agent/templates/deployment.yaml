{{- if not .Values.cluster }}{{ fail "cluster is required (the protected cluster's name)" }}{{ end }}
{{- if not .Values.apiURL }}{{ fail "apiURL is required (clearance-api)" }}{{ end }}
{{- if not .Values.coreURL }}{{ fail "coreURL is required (the core)" }}{{ end }}
{{- if not .Values.argocd.projects }}{{ fail "argocd.projects is required (the protected Argo CD projects, or [\"*\"])" }}{{ end }}
{{- if not (has .Values.scope (list "namespaces" "cluster")) }}{{ fail "scope must be namespaces or cluster" }}{{ end }}
{{- if and (eq .Values.scope "cluster") .Values.protectedNamespaces }}{{ fail "scope: cluster takes no protectedNamespaces: empty the list, or use scope: namespaces" }}{{ end }}
{{- if and .Values.optIn.enabled (eq .Values.scope "namespaces") (not .Values.protectedNamespaces) }}{{ fail "optIn.enabled needs protectedNamespaces (the namespaces the agent may label and read), or scope: cluster (docs/gate.md, Annotation opt-in)" }}{{ end }}
{{- include "agent.guards" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  {{- if .Values.ha.enabled }}
  # HA (I-44 option 0): every replica runs, only the holder of the leader Lease runs the loops; another takes over when
  # the holder stops renewing. A rolling update keeps one replica up.
  replicas: {{ .Values.ha.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  {{- else }}
  # One agent: two would each post the same outcome and exception.
  replicas: 1
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {{- include "agent.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agent.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --cluster={{ .Values.cluster }}
            - --environment={{ .Values.environment }}
            - --api-url={{ .Values.apiURL }}
            - --core-url={{ .Values.coreURL }}
            - --issuer={{ .Values.issuer }}
            - --argocd-namespace={{ .Values.argocd.namespace }}
            - --projects={{ join "," .Values.argocd.projects }}
            - --grant-api={{ .Values.grantAPI }}
            - --grant-interval={{ .Values.grantInterval }}
            - --scan-interval={{ .Values.scanInterval }}
            {{- if .Values.optIn.enabled }}
            - --optin
            - --optin-plugin-name={{ .Values.optIn.pluginName }}
            - --optin-deny={{ join "," .Values.optIn.denyApplications }}
            - --optin-namespaces={{ if eq .Values.scope "cluster" }}*{{ else }}{{ join "," .Values.protectedNamespaces }}{{ end }}
            - --optin-interval={{ .Values.optIn.interval }}
            - --optin-report-every={{ .Values.optIn.reportEvery }}
            - --optin-max-grant-bytes={{ .Values.optIn.maxGrantBytes | int64 }}
            {{- end }}
            {{- with .Values.waitJob.image }}
            - --wait-image={{ . }}
            {{- end }}
            {{- with .Values.waitJob.url }}
            - --wait-url={{ . }}
            {{- end }}
            {{- with .Values.waitJob.hostAlias }}
            - --wait-host-alias={{ . }}
            {{- end }}
            {{- with .Values.waitJob.caConfigMap }}
            - --wait-ca-configmap={{ . }}
            {{- end }}
            {{- if .Values.ha.enabled }}
            - --leader-elect
            - --leader-lease-duration={{ .Values.ha.leaseDuration }}
            - --leader-renew-deadline={{ .Values.ha.renewDeadline }}
            - --leader-retry-period={{ .Values.ha.retryPeriod }}
            {{- end }}
            {{- with .Values.statusHeartbeat }}
            - --status-heartbeat={{ . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            {{- if .Values.ha.enabled }}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            {{- end }}
            {{- if .Values.tls.caConfigMap }}
            - {name: CLEARANCE_CA_FILE, value: /etc/clearance-ca/{{ .Values.tls.caKey }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: clearance-token, mountPath: /var/run/secrets/tokens, readOnly: true}
            {{- if .Values.tls.caConfigMap }}
            - {name: clearance-ca, mountPath: /etc/clearance-ca, readOnly: true}
            {{- end }}
      volumes:
        # The agent's whole credential: a short-lived token bound to the audience the core checks, rotated by the
        # kubelet and read fresh for each request. Nothing is stored.
        - name: clearance-token
          projected:
            sources:
              - serviceAccountToken: {path: clearance, audience: {{ .Values.tokenAudience }}, expirationSeconds: 3600}
        {{- if .Values.tls.caConfigMap }}
        - name: clearance-ca
          configMap:
            name: {{ .Values.tls.caConfigMap }}
            items: [{key: {{ .Values.tls.caKey }}, path: {{ .Values.tls.caKey }}}]
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.ha.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "agent.selector" . | nindent 14 }}
      {{- end }}
{{- if .Values.ha.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "agent.selector" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "agent.selector" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
    - to:
        {{- range .Values.networkPolicy.clearanceCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.clearancePorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
{{- end }}
