apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: {{- include "agent.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Cluster-wide: which namespaces are protected, and the grants (the agent's own CRD).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
  - apiGroups: [{{ (split "/" .Values.grantAPI)._0 | quote }}]
    resources: [clearancegrants]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [{{ (split "/" .Values.grantAPI)._0 | quote }}]
    resources: [clearancegrants/status]
    verbs: [get, patch, update]
  {{- if .Values.optIn.enabled }}
  {{- if eq .Values.scope "cluster" }}
  # scope=cluster: the opt-in labels a namespace protected (and takes its own label off): get and patch, on ANY namespace.
  # RBAC cannot limit a patch to labels, nor to one label; the agent itself only writes clearance.hangar.io/protected and
  # protected-by. Discovery (/api, /apis) needs no rule: every authenticated user has it.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, patch]
  {{- else }}
  # The opt-in labels a namespace protected (and takes its own label off): get and patch, on the namespaces named in
  # protectedNamespaces and no other. Discovery (/api, /apis) needs no rule: every authenticated user has it.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, patch]
    resourceNames: {{ .Values.protectedNamespaces | toJson }}
  {{- end }}
  # The opt-in reads the ClearanceGrant CRD's schema (and only that CRD) and does not run against one that lacks the fields it writes.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get]
    resourceNames: [{{ printf "clearancegrants.%s" (split "/" .Values.grantAPI)._0 | quote }}]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "agent.fullname" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.serviceAccount.name }}, namespace: {{ .Release.Namespace }}}
---
# The agent's own state (the feed epoch and seq, the outcomes and exceptions it reported).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}-state
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-state
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agent.fullname" . }}-state}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.serviceAccount.name }}, namespace: {{ .Release.Namespace }}}
{{- if .Values.ha.enabled }}
---
# HA (I-44 option 0): the leader Lease, in this namespace only. create cannot be limited to one name; get and update are.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}-leader
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, update]
    resourceNames: [clearance-argocd-agent]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-leader
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agent.fullname" . }}-leader}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.serviceAccount.name }}, namespace: {{ .Release.Namespace }}}
{{- end }}
---
# Argo CD's Applications: read and watch{{ if .Values.optIn.enabled }}, and (the opt-in) patch{{ else }} only{{ end }}.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}-applications
  namespace: {{ .Values.argocd.namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch{{ if .Values.optIn.enabled }}, patch{{ end }}]
  {{- if .Values.optIn.enabled }}
  # An Application's parent may be an ApplicationSet: the check that it ignores a switched Application's source reads it.
  - apiGroups: [argoproj.io]
    resources: [applicationsets]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-applications
  namespace: {{ .Values.argocd.namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agent.fullname" . }}-applications}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.serviceAccount.name }}, namespace: {{ .Release.Namespace }}}
{{- if eq .Values.scope "cluster" }}
---
# scope=cluster: read the workloads of every namespace, the same list verbs the per-namespace Roles grant. No Secret, no write.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent.fullname" . }}-scan
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-scan
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "agent.fullname" . }}-scan}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.serviceAccount.name }}, namespace: {{ .Release.Namespace }}}
{{- else }}
{{- range .Values.protectedNamespaces }}
---
# Read the workloads of a protected namespace (the exception scan, the outcome's stamps). No Secret, no write.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" $ }}-scan
  namespace: {{ . }}
  labels: {{- include "agent.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [list]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" $ }}-scan
  namespace: {{ . }}
  labels: {{- include "agent.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agent.fullname" $ }}-scan}
subjects:
  - {kind: ServiceAccount, name: {{ $.Values.serviceAccount.name }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
