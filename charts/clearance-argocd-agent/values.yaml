# Clearance's Argo CD gate agent. Install it on the protected cluster (hangar-prod), in its own namespace.
image:
  repository: ghcr.io/jfillman/clearance-argocd-agent
  # Empty: v plus the chart's appVersion (the image's release tag).
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The agent's identity on the core is this service account: the core's CLEARANCE_FOREIGN_SERVICE_ACCOUNTS lists
# <namespace>/<name> and clearance-api's feedReaders names <cluster>/<namespace>/<name> (docs/gate.md).
serviceAccount:
  name: clearance-argocd-agent

# The protected cluster's name as the core knows it: its grant feed GET /v1/grant-feeds/<cluster>.
cluster: ""
# The environment of a protected namespace that carries no clearance.hangar.io/environment label. `prod` suits the cluster that is
# protected; on any other cluster (a rehearsal, a lower zone) set it, or an unlabelled namespace is cleared as prod. With optIn.enabled it is
# the environment of every opted-in Application whose namespace has no label.
environment: prod

# clearance-api (the keys, the grant feed) and the core (records, break-glass), reached from this cluster.
apiURL: ""
coreURL: ""
# CLEARANCE_TOKEN_ISSUER of the core (empty: clearance).
issuer: clearance
# The projected token's audience: the core's CLEARANCE_FOREIGN_AUDIENCE (default clearance).
tokenAudience: clearance

# Argo CD: the namespace its Applications live in, and the projects the gate protects (comma-free list; "*": all).
argocd:
  namespace: argocd
  projects: []

# How the agent is granted access to namespaces. `namespaces` (default): only the ones in protectedNamespaces, one Role and
# RoleBinding each. `cluster`: every namespace, through one ClusterRole and ClusterRoleBinding (workload list verbs, and with
# optIn.enabled get and patch on Namespaces), so no list is kept; protectedNamespaces must then be empty. The agent still only
# acts on Applications in argocd.projects. docs/gate.md, "Cluster-wide scope", says what cluster scope still limits.
scope: namespaces

# The namespaces labelled clearance.hangar.io/protected=true. The agent reads (never writes) workloads only in these
# namespaces: one Role and RoleBinding per entry, so each namespace must exist when the chart is applied. It reads no Secret anywhere. With optIn.enabled the list is also the
# only set of namespaces the agent may label: it gets get and patch on exactly these Namespace objects. Ignored (must be empty) with scope: cluster.
protectedNamespaces: []

# The ClearanceGrant CRD's group/version (G-ARGO-2).
grantAPI: clearance.hangar.io/v1

# The gate's own PreSync wait Job: the same three values the admission policy's exemption is rendered with, so the
# exception scan recognises that Job and nothing that merely copies its name. image empty: the Job is reported as
# out-of-band on every held release. url empty: coreURL. hostAlias is ip=host[,host], empty when the waiter has none.
waitJob:
  image: ""
  url: ""
  hostAlias: ""
  # The ConfigMap (key ca.crt) the wait Job mounts as its CA for an https core with a private CA; it must exist in every
  # destination namespace (trust-manager's Bundle target, say). Empty: no mount, the wait Job trusts the system roots. The
  # admission policy's exemption must carry the same optional volume (apron renders it): set both together.
  caConfigMap: ""

# TLS to the core and the api (I-43). coreURL and apiURL become https URLs; the agent verifies the server. A private CA
# (cert-manager's own, or a cluster CA) is a ConfigMap in this namespace with the CA certificate under key ca.crt; name it
# here and it is mounted and read as CLEARANCE_CA_FILE. Empty: the system roots only (a publicly trusted certificate).
tls:
  caConfigMap: ""
  caKey: ca.crt

grantInterval: 30s
scanInterval: 1m

# The annotation opt-in (G-ARGO-10c). OFF: the agent does what it did before and its RBAC is what it was. On, the agent
# switches an Application carrying clearance.hangar.io/protect: "true" to the Clearance plugin (its original sources
# handed over as the plugin's `sources`), builds one merged ClearanceGrant per namespace from the cleared trees of every
# such Application, labels the namespace protected once that grant is active, and reports the app/environment pairs
# to the core. docs/gate.md, "Annotation opt-in", says what must be in place first: the core's provider entry for the
# agent needs `protection`, a parent app-of-apps (or ApplicationSet) must ignore /spec/source and /spec/sources, and
# every destination namespace must be named in protectedNamespaces (above).
optIn:
  enabled: false
  # spec.source.plugin.name of the CMP a switched Application gets.
  pluginName: clearance
  # Applications that are never switched, whatever they carry (globs on the name or <namespace>/<name>). Clearance's
  # own Applications belong here, so the gate can always be repaired through Argo CD.
  denyApplications: [clearance, "clearance-*", "*-clearance"]
  interval: 30s
  # The protected pairs are reported again unchanged this often: the core's sign that the agent is alive.
  reportEvery: 5m
  # A merged grant over this many bytes is refused and reported; the namespace keeps its last good grant.
  maxGrantBytes: 1500000

# hangar-prod reaches the lab core over plain HTTP through a host alias to the other cluster's ingress.
hostAliases: []
#  - ip: 192.168.1.72
#    hostnames: [clearance.hangar-dev.local, clearance-api.hangar-dev.local]

# Egress for the agent: DNS, the kube-apiserver and the core/api. Off by default; turn it on with the CIDRs.
networkPolicy:
  enabled: false
  apiServerCIDRs: []
  clearanceCIDRs: []
  clearancePorts: [80, 443]

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 128Mi}
podAnnotations: {}
nodeSelector: {}
tolerations: []
