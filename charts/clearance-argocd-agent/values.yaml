# Clearance's Argo CD gate agent. Install it on the protected cluster (hangar-prod), in its own namespace.
image:
  repository: ghcr.io/jfillman/clearance-argocd-agent
  # Empty: v plus the chart's appVersion (the image's release tag).
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The agent's identity on the core is this service account: the core's CLEARANCE_FOREIGN_SERVICE_ACCOUNTS lists
# <namespace>/<name> and clearance-api's feedReaders names <cluster>/<namespace>/<name> (docs/gate.md).
serviceAccount:
  name: clearance-argocd-agent

# The protected cluster's name as the core knows it: its grant feed GET /v1/grant-feeds/<cluster>.
cluster: ""
# The environment of a protected namespace that carries no clearance.hangar.io/environment label. `prod` suits the cluster that is
# protected; on any other cluster (a rehearsal, a lower zone) set it, or an unlabelled namespace is cleared as prod. With optIn.enabled it is
# the environment of every opted-in Application whose namespace has no label.
environment: prod

# clearance-api (the keys, the grant feed) and the core (records, break-glass), reached from this cluster.
apiURL: ""
coreURL: ""
# CLEARANCE_TOKEN_ISSUER of the core (empty: clearance).
issuer: clearance
# The projected token's audience: the core's CLEARANCE_FOREIGN_AUDIENCE (default clearance).
tokenAudience: clearance

# Argo CD: the namespace its Applications live in, and the projects the gate protects (comma-free list; "*": all).
argocd:
  namespace: argocd
  projects: []

# How the agent is granted access to namespaces. `namespaces` (default): only the ones in protectedNamespaces, one Role and
# RoleBinding each. `cluster`: every namespace, through one ClusterRole and ClusterRoleBinding (workload list verbs, and with
# optIn.enabled get and patch on Namespaces), so no list is kept; protectedNamespaces must then be empty. The agent still only
# acts on Applications in argocd.projects. docs/gate.md, "Cluster-wide scope", says what cluster scope still limits.
scope: namespaces

# The namespaces labelled clearance.hangar.io/protected=true. The agent reads (never writes) workloads only in these
# namespaces: one Role and RoleBinding per entry, so each namespace must exist when the chart is applied. It reads no Secret anywhere. With optIn.enabled the list is also the
# only set of namespaces the agent may label: it gets get and patch on exactly these Namespace objects. Ignored (must be empty) with scope: cluster.
protectedNamespaces: []

# The ClearanceGrant CRD's group/version (G-ARGO-2).
grantAPI: clearance.hangar.io/v1

# The gate's own PreSync wait Job: the same three values the admission policy's exemption is rendered with, so the
# exception scan recognises that Job and nothing that merely copies its name. image empty: the Job is reported as
# out-of-band on every held release. url empty: coreURL. hostAlias is ip=host[,host], empty when the waiter has none.
waitJob:
  image: ""
  url: ""
  hostAlias: ""
  # The ConfigMap (key ca.crt) the wait Job mounts as its CA for an https core with a private CA; it must exist in every
  # destination namespace (trust-manager's Bundle target, say). Empty: no mount, the wait Job trusts the system roots. The
  # admission policy's exemption must carry the same optional volume (apron renders it): set both together.
  caConfigMap: ""
  # The previous core URL the admission policy's exemption admits for one release after the URL changes (Apron's
  # clearance.gate.previousURL). Read only by the grant-expiry webhook, which exempts the same wait Job. Empty: none.
  previousURL: ""

# TLS to the core and the api (I-43). coreURL and apiURL become https URLs; the agent verifies the server. A private CA
# (cert-manager's own, or a cluster CA) is a ConfigMap in this namespace with the CA certificate under key ca.crt; name it
# here and it is mounted and read as CLEARANCE_CA_FILE. Empty: the system roots only (a publicly trusted certificate).
tls:
  caConfigMap: ""
  caKey: ca.crt

grantInterval: 30s
scanInterval: 1m

# The annotation opt-in (G-ARGO-10c). OFF: the agent does what it did before and its RBAC is what it was. On, the agent
# switches an Application carrying clearance.hangar.io/protect: "true" to the Clearance plugin (its original sources
# handed over as the plugin's `sources`), builds one merged ClearanceGrant per namespace from the cleared trees of every
# such Application, labels the namespace protected once that grant is active, and reports the app/environment pairs
# to the core. docs/gate.md, "Annotation opt-in", says what must be in place first: the core's provider entry for the
# agent needs `protection`, a parent app-of-apps (or ApplicationSet) must ignore /spec/source and /spec/sources, and
# every destination namespace must be named in protectedNamespaces (above).
optIn:
  enabled: false
  # spec.source.plugin.name of the CMP a switched Application gets.
  pluginName: clearance
  # Applications that are never switched, whatever they carry (globs on the name or <namespace>/<name>). Clearance's
  # own Applications belong here, so the gate can always be repaired through Argo CD.
  denyApplications: [clearance, "clearance-*", "*-clearance"]
  interval: 30s
  # The protected pairs are reported again unchanged this often: the core's sign that the agent is alive.
  reportEvery: 5m
  # A merged grant over this many bytes is refused and reported; the namespace keeps its last good grant.
  maxGrantBytes: 1500000

# -- The gate's mode, and the grant-expiry webhook (I-44) -------------------------------------------------------------
# The admission policy (providers/argocd/crd/admission.yaml) has no clock: an expired grant stops admitting only once the
# agent marks it invalid, so a stalled agent leaves an expired grant admitting Argo CD's writes. The grant-expiry webhook
# below is the clock. This chart does not render the policy (the installer does); gate.enforce tells the chart the mode
# the installer runs the policy in, so the chart can refuse an unsafe pair:
#   gate.enforce: true (the policy's first binding Deny) is refused unless grantExpiry.enabled and grantExpiry.enforce are
#   both true, or grantExpiry.acceptResidualRisk is true. That one rule orders both directions: turn the webhook to enforce
#   first and the policy to Deny after it; on the way back, gate.enforce false first and grantExpiry.enforce false only in a
#   later change (docs/gate.md, "The grant-expiry webhook").
gate:
  enforce: false

grantExpiry:
  # Render the webhook: its Deployment (the agent's image, command /grant-expiry; never the agent's process), Service,
  # PodDisruptionBudget, certificate and the ValidatingWebhookConfiguration clearance-grant-expiry. Off: nothing renders.
  enabled: false
  # The Deployment's, Service's and configuration's name.
  name: clearance-grant-expiry
  # false (audit): the webhook always allows; a write it would refuse gets a warning, and when the clock is the reason the
  # audit annotation clearance.hangar.io/expired-grant; failurePolicy Ignore. true (enforce): it refuses, failurePolicy
  # Fail. Readiness reports the mode, and the probe asks for this one, so a pod still in audit is not Ready in an
  # enforce rollout.
  enforce: false
  # The recorded override of the gate.enforce rule above: Deny without an enforcing webhook, knowingly accepting that an
  # expired grant keeps admitting writes while the agent is stalled. Leave false.
  acceptResidualRisk: false
  replicas: 2
  # A grant entry stays live this long past its expiresAt (clock-skew allowance). 0s: none.
  skew: 0s
  # Argo CD's application controller, as the admission policy's matchConditions name it. Empty:
  # system:serviceaccount:<argocd.namespace>:argocd-application-controller.
  argocdUser: ""
  # The webhook's call timeout. 3 s; a lookup is an in-memory read.
  timeoutSeconds: 3
  # The cache is not synced (the pod is not Ready; enforce refuses) when the API server has not been heard from this long.
  # One unit (10m, 1h), above 330s: a healthy watch can be silent for its whole length.
  maxCacheAge: 10m
  # Argo CD sync waves: the certificate, then the Deployment (Healthy only when every pod is Ready in the rendered mode),
  # then the configuration. The admission policy's binding belongs in a LATER wave than the configuration (or a later sync):
  # its Deny may only follow an enforcing webhook.
  syncWaves: {certificate: "0", deployment: "1", webhook: "2"}
  # The serving certificate: the same scheme as the core's tls.* (cert-manager; docs/tls.md). issuerRef empty: the chart
  # builds its own namespaced CA (a self-signed Issuer, a CA Certificate, a CA Issuer), so the install needs nothing but
  # cert-manager; set, an existing Issuer or ClusterIssuer (a shared cluster CA) signs it. Either way cert-manager's CA
  # injector writes the configuration's caBundle (cert-manager.io/inject-ca-from).
  tls:
    certManager:
      enabled: true
      issuerRef: {name: "", kind: Issuer}
      duration: 2160h
      renewBefore: 720h
      caDuration: 87600h
    # With certManager.enabled false: a kubernetes.io/tls Secret in this namespace for the Service's names, and the
    # base64 PEM of the CA that signed it (the configuration's caBundle).
    existingSecret: ""
    caBundle: ""
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 96Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

# -- Agent HA and the staleness alert (I-44, option 0) ----------------------------------------------------------------
# Off by default: one replica, Recreate, as before. On: ha.replicas replicas behind one coordination.k8s.io Lease (only the
# holder runs the loops), RollingUpdate, a PodDisruptionBudget (minAvailable 1) and a topology spread.
ha:
  enabled: false
  replicas: 2
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s
# Refresh status.checkedAt of every valid grant once it is this old (one status patch per grant each time), so its age
# shows a stalled expiry pass. Empty: off (status is written only when valid changes). The alerts need it, as a positive
# duration of one unit (90s, 5m, 1h), below alerts.checkedAtStaleAfter.
statusHeartbeat: ""
# A PrometheusRule (and a PodMonitor for the grant-expiry pods, which export the grant times: a stalled agent cannot
# report itself). Needs the Prometheus Operator's CRDs, grantExpiry.enabled and statusHeartbeat.
alerts:
  enabled: false
  # ClearanceGrantStatusStale: an active grant's status.checkedAt is older than this. One unit, above statusHeartbeat
  # (the chart refuses otherwise).
  checkedAtStaleAfter: 15m
  # ClearanceGrantExpiredButValid: an active grant past spec.expiresAt is still status.valid this long (the I-44 state).
  expiredButValidFor: 2m
  # Labels on the PrometheusRule and the PodMonitor (the operator's ruleSelector / podMonitorSelector).
  labels: {}

# hangar-prod reaches the lab core over plain HTTP through a host alias to the other cluster's ingress.
hostAliases: []
#  - ip: 192.168.1.72
#    hostnames: [clearance.hangar-dev.local, clearance-api.hangar-dev.local]

# Egress for the agent: DNS, the kube-apiserver and the core/api. Off by default; turn it on with the CIDRs.
networkPolicy:
  enabled: false
  apiServerCIDRs: []
  clearanceCIDRs: []
  clearancePorts: [80, 443]

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 128Mi}
podAnnotations: {}
nodeSelector: {}
tolerations: []
