# The observation rule set the collector runs (clearance.observe-rules/v1), generated by the chart from its values. The
# attribution orders and the classification are the pipeline's defaults (internal/observe/pipeline/default.yaml, the
# documentation in docs/observe-pipeline.md); what a deployment sets is its scopes, identities, annotation names and noise.
schema: clearance.observe-rules/v1
name: {{ .Values.rules.name }}
version: {{ .Values.rules.version | quote }}
cost_limit: 10000

identities:
  argo_controller: [{{ .Values.rules.argoControllerSubject | quote }}]
  federated_prefix: [{{ range $i, $p := .Values.rules.federatedPrefixes }}{{ if $i }}, {{ end }}{{ $p | quote }}{{ end }}]
  task_id_extra_key: task_id
  apply_roles: []
  sso_admin_roles: []

annotations:
  grant: {{ .Values.rules.annotations.grant }}
  rendered: {{ .Values.rules.annotations.rendered }}
  strip: [{{ join ", " .Values.rules.annotations.strip }}]

scope:
  governed:
    - provider: kubernetes
      scopes: [{{ .Values.cluster | quote }}]
      namespaces: [{{ range $i, $n := (concat .Values.protectedNamespaces (list .Values.argocd.namespace) .Values.rules.extraGovernedNamespaces | uniq) }}{{ if $i }}, {{ end }}{{ $n | quote }}{{ end }}]
    - provider: kubernetes
      scopes: [{{ .Values.cluster | quote }}]
      kinds: [{{ join ", " .Values.rules.governedKinds }}]

noise:
  - name: argo-application-bookkeeping
    provider: kubernetes
    why: Argo CD's controller updating the Application objects it manages (sync status, health, operation state) in its own namespace. It writes no workload; the objects it applies are attributed, not filtered.
    identity: {subject: {{ .Values.rules.argoControllerSubject | quote }}}
    shape: {kinds: [Application], verbs: [update, patch], namespaces: [{{ .Values.argocd.namespace }}]}
  - name: cert-manager-secret-rotation
    provider: kubernetes
    why: cert-manager rotating the Secrets of Certificates it owns (the owner reference names a Certificate).
    identity: {subject: "system:serviceaccount:cert-manager:cert-manager"}
    shape:
      kinds: [Secret]
      verbs: [create, update, patch]
      when: 'event.owners.exists(o, o.kind == "Certificate")'
{{- if .Values.rules.hpaNamespaces }}
  - name: hpa-scale
    provider: kubernetes
    why: the HorizontalPodAutoscaler setting replicas through the /scale subresource.
    identity: {subject: "system:serviceaccount:kube-system:horizontal-pod-autoscaler"}
    shape: {kinds: [Deployment, StatefulSet, ReplicaSet], verbs: [update, patch], subresources: [scale], namespaces: [{{ join ", " .Values.rules.hpaNamespaces }}]}
{{- end }}
{{- range .Values.rules.kubeletNodes }}
  - name: kubelet-serviceaccount-tokens-{{ . }}
    provider: kubernetes
    why: this node's kubelet minting the short-lived projected token of a pod it runs.
    identity: {subject: "system:node:{{ . }}"}
    shape: {kinds: [ServiceAccount], verbs: [create], subresources: [token]}
{{- end }}
  - name: controller-manager-own-tokens
    provider: kubernetes
    why: kube-controller-manager minting the tokens of its own controllers in kube-system.
    identity: {subject: "system:kube-controller-manager"}
    shape: {kinds: [ServiceAccount], verbs: [create], subresources: [token], namespaces: [kube-system]}
  - name: deployment-controller-status
    provider: kubernetes
    why: the Deployment controller writing the status subresource; it changes no workload.
    identity: {subject: "system:serviceaccount:kube-system:deployment-controller"}
    shape: {kinds: [Deployment], verbs: [update], subresources: [status], namespaces: [kube-system]}
  - name: replicaset-controller-status
    provider: kubernetes
    why: the ReplicaSet controller writing the status subresource; it changes no workload.
    identity: {subject: "system:serviceaccount:kube-system:replicaset-controller"}
    shape: {kinds: [ReplicaSet], verbs: [update], subresources: [status], namespaces: [kube-system]}
  - name: applicationset-status
    provider: kubernetes
    why: the ApplicationSet controller writing the status subresource of ApplicationSets in its own namespace.
    identity: {subject: "system:serviceaccount:{{ .Values.argocd.namespace }}:argocd-applicationset-controller"}
    shape: {kinds: [Applicationset, ApplicationSet], verbs: [update], subresources: [status], namespaces: [{{ .Values.argocd.namespace }}]}
  - name: prometheus-operator-kubelet-service
    provider: kubernetes
    why: the Prometheus operator keeping the one kubelet Service it owns in kube-system up to date.
    identity: {subject: "system:serviceaccount:observability:kube-prometheus-stack-operator"}
    shape:
      kinds: [Service]
      verbs: [update]
      namespaces: [kube-system]
      when: 'event.name == "kube-prometheus-stack-kubelet"'
  - name: crossplane-owned-crds
    provider: kubernetes
    why: Crossplane establishing the CRDs its provider revisions and composite resource definitions own.
    identity: {subject: "system:serviceaccount:crossplane-system:crossplane"}
    shape:
      kinds: [CustomResourceDefinition]
      verbs: [update, patch]
      when: 'event.owners.exists(o, o.kind == "ProviderRevision" || o.kind == "CompositeResourceDefinition")'

monitoring:
  kubernetes: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
  kubernetes_configmaps: [kube-system/audit-policy]
  # The only carve-out: a controller that maintains its own webhook configurations. A succeeded write by exactly this
  # subject, with these verbs, to these kinds and names, is routine noise (counted as filtered under
  # monitoring-exempt:<name>): not monitoring-protection, no alert, no health flip, no exception. Anything else by the same
  # subject (another verb, another name, a refused attempt, the audit-policy ConfigMap) stays monitoring-protection.
  # A compromised named controller could change its own webhook without an alert: that is the price of the exemption.
  kubernetes_exempt:
    - name: kyverno-own-webhooks
      why: Kyverno's admission controller rewrites its own kyverno-* webhook configurations every ~20s.
      subject: "system:serviceaccount:kyverno:kyverno-admission-controller"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["kyverno-*"]
    - name: cert-manager-cainjector-cabundle
      why: cert-manager's cainjector patches caBundle into the webhook configurations that ask for it.
      subject: "system:serviceaccount:cert-manager:cert-manager-cainjector"
      verbs: [patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*"]
    - name: kyverno-cleanup-own-webhooks
      why: Kyverno's cleanup controller rewrites its own cleanup and TTL webhook configurations when it starts or the API server restarts.
      subject: "system:serviceaccount:kyverno:kyverno-cleanup-controller"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["kyverno-cleanup-*", "kyverno-ttl-*"]
    - name: tekton-operator-own-webhooks
      why: The Tekton operator reconciles its own webhook configurations when it starts or the API server restarts.
      subject: "system:serviceaccount:tekton-operator:tekton-operator"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*.operator.tekton.dev"]
    - name: tekton-operators-proxy-own-webhook
      why: Tekton's operator proxy webhook reconciles its own mutating webhook configuration.
      subject: "system:serviceaccount:tekton-pipelines:tekton-operators-proxy-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["proxy.operator.tekton.dev"]
    - name: tekton-pipelines-own-webhooks
      why: The Tekton Pipelines webhook reconciles its own webhook configurations.
      subject: "system:serviceaccount:tekton-pipelines:tekton-pipelines-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*.pipeline.tekton.dev"]
    - name: tekton-triggers-own-webhooks
      why: The Tekton Triggers webhook reconciles its own webhook configurations.
      subject: "system:serviceaccount:tekton-pipelines:tekton-triggers-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["*.triggers.tekton.dev"]
    - name: pipelines-as-code-own-webhook
      why: The Pipelines-as-Code webhook reconciles its own validating webhook configuration.
      subject: "system:serviceaccount:tekton-pipelines:pipelines-as-code-webhook"
      verbs: [update, patch]
      kinds: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      names: ["validation.pipelinesascode.tekton.dev"]

