apiVersion: v1
kind: Service
metadata:
  name: {{ include "observe.fullname" . }}
  labels: {{- include "observe.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webhook.service.type }}
  {{- with .Values.webhook.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector: {{- include "observe.selector" . | nindent 4 }}
  ports:
    - name: audit
      port: {{ .Values.webhook.port }}
      targetPort: audit
      {{- if and (eq .Values.webhook.service.type "NodePort") .Values.webhook.service.nodePort }}
      nodePort: {{ .Values.webhook.service.nodePort }}
      {{- end }}
