{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observe.fullname" . }}
  labels: {{- include "observe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "observe.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Only the control plane (where the API server posts audit batches from, and the kubelet probes) reaches the pod.
  ingress:
    - from:
        {{- range .Values.networkPolicy.controlPlaneCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {port: {{ .Values.webhook.port }}, protocol: TCP}
        - {port: 8080, protocol: TCP}
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
    - to:
        {{- range .Values.networkPolicy.clearanceCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.clearancePorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
{{- end }}
