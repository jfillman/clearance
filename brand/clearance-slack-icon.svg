<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="1024" height="1024" role="img" aria-label="Clearance">
  <!-- Slack app icon from the Hangar family Clearance mark (hangar brand/marks/clearance-tile.svg): full-bleed
       instrument-black square (Slack rounds the corners itself), the dial scaled up to fill the icon. -->
  <rect width="96" height="96" fill="#0B0D10"/>
  <g transform="translate(48 49) scale(0.98) translate(-48 -48)">
    <circle cx="48" cy="48" r="40" fill="none" stroke="#262C33" stroke-width="2"/>
    <g stroke="#66717B" stroke-width="2">
      <line x1="48" y1="8" x2="48" y2="15" transform="rotate(0 48 48)"/><line x1="48" y1="8" x2="48" y2="15" transform="rotate(45 48 48)"/>
      <line x1="48" y1="8" x2="48" y2="15" transform="rotate(90 48 48)"/><line x1="48" y1="8" x2="48" y2="15" transform="rotate(135 48 48)"/>
      <line x1="48" y1="8" x2="48" y2="15" transform="rotate(180 48 48)"/><line x1="48" y1="8" x2="48" y2="15" transform="rotate(225 48 48)"/>
      <line x1="48" y1="8" x2="48" y2="15" transform="rotate(270 48 48)"/><line x1="48" y1="8" x2="48" y2="15" transform="rotate(315 48 48)"/>
    </g>
    <polygon points="44,2 52,2 48,9" fill="#E8A33D"/>
    <path d="M35,37 L44.5,46.5 L61.5,29.5" fill="none" stroke="#5FAE84" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="29" y1="57" x2="67" y2="57" stroke="#5FAE84" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="29" y1="65" x2="67" y2="65" stroke="#5FAE84" stroke-width="3.2" stroke-dasharray="5.5 4.3"/>
  </g>
</svg>
