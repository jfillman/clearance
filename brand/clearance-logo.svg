<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Clearance</title>
  <!-- Instrument-panel ground, Hangar's dark surface -->
  <rect width="512" height="512" rx="104" fill="#14181D"/>
  <!-- The C: a gauge arc, open to the right where the clearance passes through -->
  <path d="M352 140 A160 160 0 1 0 352 372" fill="none" stroke="#E8A33D" stroke-width="44" stroke-linecap="round"/>
  <!-- Cleared: a check whose stroke leaves through the gap -->
  <path d="M168 266 L230 326 L398 198" fill="none" stroke="#6FB2D9" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
