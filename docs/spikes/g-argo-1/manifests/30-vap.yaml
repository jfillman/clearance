# Spike c, native: ValidatingAdmissionPolicy with paramKind ClearanceGrant. Warn + Audit only (never Deny here).
# Matches only the scratch Argo CD's application-controller, only CREATE/UPDATE of main resources (the subresource
# guarded), only in namespaces labelled clearance.hangar.io/protected=true. Every matchConditions expression is
# has()-guarded. CEL has no clock in admission, so expiry is the agent's job (status.valid); see gate.md.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spike-clearance-protected-writes
  labels: {hangar.io/spike: g-argo-1}
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: spike.clearance.hangar.io/v1, kind: ClearanceGrant}
  matchConstraints:
    namespaceSelector:
      matchLabels: {clearance.hangar.io/protected: "true"}
    resourceRules:
      - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [configmaps, serviceaccounts, services, deployments, jobs, networkpolicies]
  matchConditions:
    - name: argo-controller-main-resource
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username == 'system:serviceaccount:clearance-spike-argo:argocd-application-controller' &&
        (!has(request.subResource) || request.subResource == '')
  variables:
    - name: ann
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: rendered
      expression: "'clearance.hangar.io/rendered' in variables.ann ? variables.ann['clearance.hangar.io/rendered'] : ''"
    - name: key
      expression: "(object.apiVersion.contains('/') ? object.apiVersion.split('/')[0] : '') + '/' + object.kind + '/' + object.metadata.name"
  validations:
    - expression: "variables.rendered != ''"
      messageExpression: "'no clearance.hangar.io/rendered annotation on ' + variables.key"
    - expression: "has(params.status) && has(params.status.valid) && params.status.valid"
      messageExpression: "'grant ' + params.metadata.name + ' is not valid (expired or unverified)'"
    - expression: "has(params.spec.index) && variables.key in params.spec.index && params.spec.index[variables.key] == variables.rendered"
      messageExpression: "'grant ' + params.metadata.name + ' does not list ' + variables.key + ' at ' + variables.rendered"
  auditAnnotations:
    - key: grant
      valueExpression: "params.metadata.name"
---
# One binding: paramRef by selector, no namespace, so the grant is read from the admitted object's own namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spike-clearance-protected-writes
  labels: {hangar.io/spike: g-argo-1}
spec:
  policyName: spike-clearance-protected-writes
  validationActions: [Warn, Audit]
  paramRef:
    selector:
      matchLabels: {clearance.hangar.io/active: "true"}
    parameterNotFoundAction: Deny
