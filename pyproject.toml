[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearance"
version = "0.1.0"
description = "Policy, audit and session gateway for AI agent workloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cel-python>=0.5", "jsonschema>=4.20", "pyyaml>=6", "mcp>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/clearance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
