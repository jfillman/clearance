[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearance"
version = "0.24.1"
description = "Policy, audit and session gateway for AI agent workloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cel-python>=0.5", "jsonschema>=4.20", "pyyaml>=6", "mcp>=2", "pyjwt[crypto]>=2.8"]

# `clearance register`: the deployment gate's CI step (src/clearance/register.py, docs/provenance-app.md phase 2b).
[project.scripts]
clearance = "clearance.register:cli"

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]
# The durable store and evidence sink (clearance.pg).
pg = ["psycopg[binary]>=3.2"]
test = ["pytest>=8", "psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/clearance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
